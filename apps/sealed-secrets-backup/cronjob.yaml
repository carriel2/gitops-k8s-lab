# WEEKLY backup of the Sealed Secrets keys. Without these keys the SealedSecrets stored in Git cannot be decrypted
# (if the cluster is rebuilt, everything encrypted in the repository is lost).
#
# Three steps, each in the image that has the right tool: 1) read the controller keys, 2) encrypt them with the
# PUBLIC certificate (backup.crt), 3) upload to S3. The plaintext only exists in memory (emptyDir Memory), mounted
# only in steps 1 and 2; step 2 deletes it, and step 3 only sees the encrypted file.
# Only the holder of the matching PRIVATE key (kept outside the cluster) can open the file. The Pod never sees the
# private key: stealing the S3 object or the Pod itself does not reveal the keys.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sealed-keys-backup
spec:
  schedule: "30 22 * * 6"            # Saturday 22:30
  timeZone: America/Sao_Paulo
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 86400     # if the cluster was down at the scheduled time, still runs up to 1 day later
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: sealed-keys-backup
        spec:
          restartPolicy: Never
          serviceAccountName: sealed-keys-backup      # token automount stays on: kubectl needs it
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: read-keys
              image: alpine/k8s:1.32.13       # keep kubectl within one minor version of your cluster
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  kubectl get secrets -l sealedsecrets.bitnami.com/sealed-secrets-key -o yaml > /plain/keys.yaml
                  n=$(grep -c 'sealedsecrets.bitnami.com/sealed-secrets-key' /plain/keys.yaml || true)
                  [ "$n" -ge 1 ] || { echo "ERROR: no Sealed Secrets key found"; exit 1; }
                  echo "keys found: $n"
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              env:
                - {name: HOME, value: /tmp}
              volumeMounts:
                - {name: plain, mountPath: /plain}
                - {name: tmp, mountPath: /tmp}
            - name: encrypt
              image: alpine/openssl:3.5.9
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  openssl cms -encrypt -aes256 -binary -outform DER -in /plain/keys.yaml -out /out/sealed-keys.cms /etc/backup-cert/backup.crt
                  rm -f /plain/keys.yaml
                  size=$(wc -c < /out/sealed-keys.cms)
                  [ "$size" -gt 1000 ] || { echo "ERROR: encrypted file is too small ($size bytes)"; exit 1; }
                  echo "encrypted: $size bytes"
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - {name: plain, mountPath: /plain}
                - {name: out, mountPath: /out}
                - {name: backup-cert, mountPath: /etc/backup-cert, readOnly: true}
          containers:
            - name: upload
              image: alpine/k8s:1.32.13
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  stamp=$(date -u +%Y-%m-%dT%H%M%SZ)
                  key="$BACKUP_S3_PREFIX/sealed-keys-$stamp.cms"
                  size=$(wc -c < /out/sealed-keys.cms)
                  aws configure set default.s3.addressing_style path
                  aws --endpoint-url "$BACKUP_S3_ENDPOINT" s3 cp /out/sealed-keys.cms "s3://$BACKUP_S3_BUCKET/$key" --only-show-errors
                  remote=$(aws --endpoint-url "$BACKUP_S3_ENDPOINT" s3api head-object --bucket "$BACKUP_S3_BUCKET" --key "$key" --query ContentLength --output text)
                  [ "$remote" = "$size" ] || { echo "ERROR: size on S3 ($remote) differs from local ($size)"; exit 1; }
                  echo "OK: $key ($size bytes) uploaded and verified"
              env:
                - {name: HOME, value: /tmp}
                - {name: BACKUP_S3_PREFIX, value: gitops-k8s-lab/sealed-keys}
                - {name: AWS_DEFAULT_REGION, value: us-east-1}
                # S3-compatible stores often reject the new aws cli v2 checksums; only compute them when required.
                - {name: AWS_REQUEST_CHECKSUM_CALCULATION, value: when_required}
                - {name: AWS_RESPONSE_CHECKSUM_VALIDATION, value: when_required}
                - name: AWS_ACCESS_KEY_ID
                  valueFrom: {secretKeyRef: {name: sealed-keys-backup-s3, key: BACKUP_S3_ACCESS_KEY}}
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom: {secretKeyRef: {name: sealed-keys-backup-s3, key: BACKUP_S3_SECRET_KEY}}
                - name: BACKUP_S3_ENDPOINT
                  valueFrom: {secretKeyRef: {name: sealed-keys-backup-s3, key: BACKUP_S3_ENDPOINT}}
                - name: BACKUP_S3_BUCKET
                  valueFrom: {secretKeyRef: {name: sealed-keys-backup-s3, key: BACKUP_S3_BUCKET}}
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - {name: out, mountPath: /out, readOnly: true}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: plain                  # plaintext keys: memory only, gone with the Pod
              emptyDir: {medium: Memory}
            - name: out
              emptyDir: {}
            - name: tmp
              emptyDir: {}
            - name: backup-cert
              configMap:
                name: sealed-keys-backup-cert
