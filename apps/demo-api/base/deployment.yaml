apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api
  labels:
    app.kubernetes.io/name: demo-api
    app.kubernetes.io/part-of: gitops-k8s-lab
spec:
  replicas: 2
  revisionHistoryLimit: 3          # keeps the last 3 ReplicaSets
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-api
        app.kubernetes.io/part-of: gitops-k8s-lab
    spec:
      automountServiceAccountToken: false   # the app never talks to the Kubernetes API
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # No tag here on purpose: the tag (sha-xxxxxxx) is set by the overlay, under "images:".
          image: ghcr.io/carriel2/gitops-k8s-lab-demo-api
          # Same command as the Dockerfile plus --proxy-headers. In the base only loopback is trusted
          # for X-Forwarded-For; the overlay widens it to the node CIDR once the app sits behind a WAF.
          command:
            - uvicorn
            - main:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --proxy-headers
            - --forwarded-allow-ips
            - 127.0.0.1
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: demo-api-config        # non-secret configuration, generated by Kustomize
            - secretRef:
                name: demo-api-env           # created by the SealedSecret (see README); optional
                optional: true
          readinessProbe:                    # only receives traffic once /health answers
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:                     # restarts the container if /health stops answering
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
