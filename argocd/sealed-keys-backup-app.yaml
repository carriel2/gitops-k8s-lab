# Weekly backup of the Sealed Secrets keys (CronJob). Same namespace as the controller, so it can read the keys there.
# Apply this only after committing backup.crt (see apps/sealed-secrets-backup/README.md).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-keys-backup
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/carriel2/gitops-k8s-lab.git
    targetRevision: HEAD
    path: apps/sealed-secrets-backup
  destination:
    server: https://kubernetes.default.svc
    namespace: sealed-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
