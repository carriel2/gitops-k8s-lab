# Sealed Secrets: lets you keep Secrets in Git ENCRYPTED. The controller (running in the cluster) is the only holder
# of the private key that decrypts them; whoever only has the Git repository cannot read anything.
#
# This Application uses a Helm chart as its source (not a Git folder): Argo CD downloads the chart, renders it with
# the values below and applies the result. The chart version is PINNED in targetRevision (never "latest").
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.20.0                              # controller 0.40.0
    helm:
      releaseName: sealed-secrets
      values: |
        # Fixed controller name: it is what kubeseal looks for by default.
        fullnameOverride: sealed-secrets-controller
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: sealed-secrets        # its own namespace, kept apart from kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
