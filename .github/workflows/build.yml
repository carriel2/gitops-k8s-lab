name: build-demo-api

# Builds the demo API image and pushes it to GHCR tagged with the short commit SHA.
# Deploying is NOT done here: promotion happens by changing "newTag" in
# apps/demo-api/overlays/lab/kustomization.yaml, and Argo CD applies it.

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name and tag
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-demo-api" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.tag }}
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}

      - name: Summary
        run: |
          {
            echo "### Image published"
            echo ""
            echo "\`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}\`"
            echo ""
            echo "To deploy it, set \`newTag: ${{ steps.meta.outputs.tag }}\` in"
            echo "\`apps/demo-api/overlays/lab/kustomization.yaml\`, commit and push."
          } >> "$GITHUB_STEP_SUMMARY"
